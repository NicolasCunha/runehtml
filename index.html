<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuneHTML - Terminal Idle Game</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <span class="terminal-title">RuneHTML Terminal v1.0</span>
        </div>
        <div class="terminal-screen">
            <div id="game-content">
                <!-- Logo -->
                <div class="logo">
                    <pre class="ascii-logo">
 ____                  _   _ _____ __  __ _     
|  _ \ _   _ _ __   ___| | | |_   _|  \/  | |    
| |_) | | | | '_ \ / _ \ |_| | | | | |\/| | |    
|  _ <| |_| | | | |  __/  _  | | | | |  | | |___ 
|_| \_\\__,_|_| |_|\___|_| |_| |_| |_|  |_|_____|
                    </pre>
                </div>

                <!-- Main Menu -->
                <div id="main-menu" class="menu">
                    <div class="menu-item" data-action="new-game">
                        <span class="menu-cursor">></span><span class="menu-text">New Game</span>
                    </div>
                    <div class="menu-item" data-action="load-game" id="load-game-menu-item">
                        <span class="menu-cursor">></span><span class="menu-text">Load Game</span>
                    </div>
                </div>

                <!-- Game Area (hidden initially) -->
                <div id="game-area" style="display: none;">
                    <!-- Game content will go here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Load modules in order: utilities first, then main game -->
    <script src="js/modal.js"></script>
    <script src="js/usernameGenerator.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/gameState.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
