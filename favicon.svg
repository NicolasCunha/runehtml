<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Black background -->
  <rect width="32" height="32" fill="#000000"/>
  
  <!-- Terminal border -->
  <rect x="2" y="2" width="28" height="28" fill="none" stroke="#00ff00" stroke-width="1.5"/>
  
  <!-- R letter in pixelated style -->
  <g fill="#00ff00">
    <!-- Vertical line of R -->
    <rect x="8" y="8" width="2" height="16"/>
    
    <!-- Top horizontal of R -->
    <rect x="8" y="8" width="8" height="2"/>
    
    <!-- Middle part of R -->
    <rect x="14" y="8" width="2" height="6"/>
    <rect x="8" y="14" width="6" height="2"/>
    
    <!-- Diagonal leg of R -->
    <rect x="10" y="16" width="2" height="2"/>
    <rect x="12" y="18" width="2" height="2"/>
    <rect x="14" y="20" width="2" height="4"/>
    
    <!-- H letter -->
    <!-- Left vertical of H -->
    <rect x="18" y="8" width="2" height="16"/>
    
    <!-- Right vertical of H -->
    <rect x="24" y="8" width="2" height="16"/>
    
    <!-- Middle horizontal of H -->
    <rect x="18" y="15" width="8" height="2"/>
  </g>
  
  <!-- Small cursor dot -->
  <rect x="27" y="23" width="2" height="2" fill="#00ff00">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
